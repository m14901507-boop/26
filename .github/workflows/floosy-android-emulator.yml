name: FLOOSY Android emulator SMS and SQLite tests

on:
  workflow_dispatch:
  push:
    branches: [floosy-android-app]
    paths:
      - 'floosy-android/**'
      - '.github/workflows/floosy-android-emulator.yml'

permissions:
  contents: read

jobs:
  android-emulator:
    name: Android emulator / fictitious SMS / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Linux KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test FLOOSY in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash floosy-android/ci/run_emulator_tests.sh
