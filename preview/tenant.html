<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLOOSY — صفحة المستأجر</title><style>
:root{--bg:#050505;--card:#171d28;--card2:#202838;--blue:#1687ff;--gold:#ffc928;--green:#21d38b;--red:#ff4458;--text:#f8fafc;--muted:#9aa4b2;--line:#323d50}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,rgba(22,135,255,.18),transparent 28%),radial-gradient(circle at 10% 85%,rgba(255,201,40,.08),transparent 24%),#050505;color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe36d,#ffc928);color:#111;font-size:25px;font-weight:900;box-shadow:0 10px 30px rgba(255,201,40,.22)}.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 55px rgba(0,0,0,.35);margin-bottom:14px}.hero{border-color:rgba(22,135,255,.45)}h1,h2{margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:14px;border:1px solid #344055;border-radius:14px;background:#111722}.metric label{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:7px;font-size:20px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #30394a;text-align:right}th{color:var(--gold)}.amount{color:var(--green);font-weight:700}.status{padding:12px;border-radius:12px;border:1px solid rgba(255,201,40,.45);background:#171409;color:var(--gold)}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="brand"><div class="logo">F</div><div><h2>FLOOSY</h2><div class="muted">بوابة المستأجر والإيصالات</div></div></div><div id="status" class="status">جاري تحميل بيانات الإيجار…</div><div id="content" style="display:none"><div class="card hero"><h1 id="name">—</h1><div class="muted">هذه الصفحة مخصصة لعرض بيانات الإيجار والإيصالات فقط.</div></div><div class="grid"><div class="metric"><label>الوحدة</label><strong id="unit">—</strong></div><div class="metric"><label>الإيجار الشهري</label><strong id="rent">—</strong></div><div class="metric"><label>يوم الاستحقاق</label><strong id="due">—</strong></div></div><div class="card" style="margin-top:14px"><h2>سجل الإيصالات</h2><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>الملاحظات</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>
const API='https://floosy-api.m14901507.workers.dev',$=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' ر.ع',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let t=new URLSearchParams(location.search).get('t')||'';try{let r=await fetch(API+'/public/rental?t='+encodeURIComponent(t)),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر فتح الصفحة');$('name').textContent=d.tenant.name||'المستأجر';$('unit').textContent=d.tenant.unit||'—';$('rent').textContent=money(d.tenant.monthlyRent);$('due').textContent=d.tenant.dueDay||'—';$('rows').innerHTML=(d.receipts||[]).map(x=>`<tr><td>${esc(x.date)}</td><td class="amount">${money(x.amount)}</td><td>${esc(x.notes||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">لا توجد إيصالات مسجلة حتى الآن.</td></tr>';$('status').style.display='none';$('content').style.display='block'}catch(e){$('status').textContent=e.message}}load();
</script></body></html>
