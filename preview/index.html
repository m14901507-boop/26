<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Floosy React Preview</title>
  <meta name="theme-color" content="#07111e" />
  <style>
    :root{--bg:#07111e;--card:#0d1b2a;--border:#26384a;--text:#f8fafc;--muted:#9fb0c3;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}.loading-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.loading-card{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;text-align:center}.loading-card p{color:var(--muted)}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:22px 14px;background:#091624;border-left:1px solid var(--border)}.brand{font-size:24px;font-weight:800;margin-bottom:26px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:right;background:transparent;border:1px solid transparent;color:var(--muted);padding:12px;border-radius:12px;cursor:pointer}.nav button.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);color:#fff}.main{padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0}.top p{color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input{background:#091624;color:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 12px}.status{margin:18px 0;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(245,158,11,.1)}.status.ok{background:rgba(34,197,94,.1)}.login{max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:20px 0}.login form{display:flex;gap:8px}.login input{flex:1}.kpis,.accounts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.accounts{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}.card span,.card small{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:25px;margin:9px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.panel h2{margin-top:0}.budget{margin:12px 0}.budget .row{display:flex;justify-content:space-between;gap:10px}.track{height:8px;background:#17263a;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa)}.tx{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}.tx small{display:block;color:var(--muted);margin-top:4px}.muted{color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.kpis,.accounts,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:560px){.kpis,.accounts,.grid2{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}.login form{flex-direction:column}}
  </style>
</head>
<body>
<div id="root">
  <div class="loading-screen"><div class="loading-card"><h1>فلوسي</h1><p id="bootMessage">جاري تشغيل نسخة React التجريبية...</p></div></div>
</div>
<script type="module">
const bootMessage = document.getElementById('bootMessage');
try {
  const ReactModule = await import('https://esm.sh/react@18.3.1');
  const ReactDOMModule = await import('https://esm.sh/react-dom@18.3.1/client');
  const React = ReactModule.default || ReactModule;
  const {useEffect,useMemo,useState} = ReactModule;
  const {createRoot} = ReactDOMModule;
  const h = React.createElement;
  const API='https://floosy-api.m14901507.workers.dev';
  const defs=[['عائلي شهري','AHLI_001','الأهلي 001'],['عائلي سنوي','AHLI_001','الأهلي 001'],['شخصي شهري','AHLI_001','الأهلي 001'],['شخصي سنوي','AHLI_001','الأهلي 001'],['تأمين المصروف','AHLI_002','الأهلي 002'],['تأمين الدخل','AHLI_002','الأهلي 002'],['الادخار والاستثمار','DHOFAR','بنك ظفار']];
  const money=(v)=>Number.isFinite(Number(v))?`${Number(v).toLocaleString('ar-OM',{minimumFractionDigits:3,maximumFractionDigits:3})} ر.ع`:'—';
  const nowMonth=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
  const serial=(m)=>{const [y,n]=m.split('-').map(Number);return Math.round((Date.UTC(y,n-1,1)-Date.UTC(1899,11,30))/86400000)};
  const matchMonth=(v,m)=>{if(typeof v==='number')return Math.abs(v-serial(m))<2;const [y,mm]=m.split('-');const t=String(v||'').trim();return t===`${mm}/${y}`||t===`${y}-${mm}`||t.startsWith(`01/${mm}/${y}`)||t.startsWith(`${y}-${mm}-01`)};
  async function request(path,options={}){const token=sessionStorage.getItem('floosy_preview_session');const headers={Accept:'application/json',...(options.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API+path,{...options,headers,credentials:'omit'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`API ${r.status}`);return d}
  function App(){
    const [month,setMonth]=useState(nowMonth());
    const [rows,setRows]=useState([]);
    const [messages,setMessages]=useState([]);
    const [unread,setUnread]=useState(null);
    const [status,setStatus]=useState('نسخة React التجريبية جاهزة.');
    const [ok,setOk]=useState(false);
    const [pass,setPass]=useState('');
    const [busy,setBusy]=useState(false);
    const [tab,setTab]=useState('dashboard');
    const refresh=async()=>{setBusy(true);setStatus('جاري تحميل البيانات...');try{const [b,u,m]=await Promise.all([request('/api/budgets'),request('/api/gmail/unread'),request('/api/gmail/recent-bank-messages')]);setRows(b.rows||[]);setUnread(u.unread);setMessages(m.messages||[]);setOk(true);setStatus('تم تحميل البيانات بنجاح.');}catch(e){setOk(false);setStatus(e?.message||String(e));}finally{setBusy(false)}};
    useEffect(()=>{if(sessionStorage.getItem('floosy_preview_session'))refresh()},[]);
    const login=async(e)=>{e.preventDefault();setBusy(true);try{const d=await request('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});if(d.session)sessionStorage.setItem('floosy_preview_session',d.session);setPass('');await refresh();}catch(e){setStatus(e?.message||String(e))}finally{setBusy(false)}};
    const monthRows=useMemo(()=>rows.filter(r=>matchMonth(r[0],month)),[rows,month]);
    const map=useMemo(()=>new Map(monthRows.map(r=>[String(r[2]||''),r])),[monthRows]);
    const budgets=defs.map(([budget,key,name])=>({budget,key,name,amount:map.get(budget)?.[4]??null}));
    const total=budgets.reduce((s,x)=>s+(Number.isFinite(Number(x.amount))?Number(x.amount):0),0);
    const configured=budgets.filter(x=>Number.isFinite(Number(x.amount))).length;
    const title=tab==='dashboard'?'لوحة العرض':tab==='budgets'?'الموازنات':tab==='transactions'?'آخر العمليات':'الحسابات';
    const nav=h('div',{className:'nav'},[['dashboard','لوحة العرض'],['budgets','الموازنات'],['transactions','آخر العمليات'],['accounts','الحسابات']].map(([k,l])=>h('button',{key:k,className:tab===k?'active':'',onClick:()=>setTab(k)},l)));
    const kpis=h('section',{className:'kpis'},[
      ['إجمالي الموازنات',money(total),'للشهر المحدد'],['الموازنات المحددة',`${configured} / ${defs.length}`,'من نفس الورقة الحالية'],['Gmail غير المقروء',unread??'—','من Gmail API'],['آخر العمليات',messages.length||'—','معاينة بنكية']
    ].map(([a,b,c])=>h('div',{className:'card',key:a},h('span',null,a),h('strong',null,b),h('small',null,c))));
    const accountCards=h('section',{className:'accounts'},[
      ['الأهلي 001','عائلي + شخصي'],['الأهلي 002','تأمين المصروف + الدخل'],['بنك ظفار','الادخار والاستثمار']
    ].map(([a,b])=>h('div',{className:'card',key:a},h('span',null,a),h('strong',null,'—'),h('small',null,b))));
    const budgetPanel=h('div',{className:'panel'},h('h2',null,'توزيع الموازنات'),...budgets.map(x=>{const p=total>0?Number(x.amount||0)/total*100:0;return h('div',{className:'budget',key:x.budget},h('div',{className:'row'},h('span',null,x.budget),h('strong',null,money(x.amount))),h('div',{className:'track'},h('div',{className:'fill',style:{width:`${Math.min(100,p)}%`}})))}));
    const txPanel=h('div',{className:'panel'},h('h2',null,'آخر العمليات البنكية'),...(messages.length?messages.slice(0,8).map(x=>h('div',{className:'tx',key:x.id},h('div',null,h('strong',null,x.subject||'عملية بنكية'),h('small',null,`${x.bank} · ${x.operationType}`)),h('b',null,money(x.amount)))):[h('p',{className:'muted',key:'empty'},'لا توجد بيانات.')]))
    let content=null;
    if(tab==='dashboard') content=h(React.Fragment,null,kpis,accountCards,h('section',{className:'grid2'},budgetPanel,txPanel));
    if(tab==='budgets') content=h('div',{className:'panel'},h('h2',null,'الموازنات الحالية'),...budgets.map(x=>h('div',{className:'tx',key:x.budget},h('div',null,h('strong',null,x.budget),h('small',null,x.name)),h('b',null,money(x.amount)))));
    if(tab==='transactions') content=h('div',{className:'panel'},h('h2',null,'آخر العمليات'),...messages.map(x=>h('div',{className:'tx',key:x.id},h('div',null,h('strong',null,x.subject||'عملية بنكية'),h('small',null,`${x.bank} · ${x.operationType} · ${x.date||''}`)),h('b',null,money(x.amount)))));
    if(tab==='accounts') content=accountCards;
    return h('div',{className:'shell'},h('aside',{className:'side'},h('div',{className:'brand'},'فلوسي',h('small',null,'React Preview')),nav),h('main',{className:'main'},h('div',{className:'top'},h('div',null,h('h1',null,title),h('p',null,'نسخة React تجريبية مستقلة — لا تغيّر الموقع الرئيسي.')),h('div',{className:'actions'},h('input',{type:'month',value:month,onChange:e=>setMonth(e.target.value)}),h('button',{onClick:refresh,disabled:!ok||busy},'تحديث'))),h('div',{className:`status ${ok?'ok':''}`},status),!ok?h('div',{className:'login'},h('h2',null,'تسجيل الدخول إلى Floosy'),h('form',{onSubmit:login},h('input',{type:'password',value:pass,onChange:e=>setPass(e.target.value),placeholder:'كلمة المرور',required:true}),h('button',{disabled:busy},'دخول'))):null,content));
  }
  createRoot(document.getElementById('root')).render(h(App));
} catch (error) {
  console.error(error);
  if (bootMessage) bootMessage.textContent = 'تعذر تحميل React: ' + (error?.message || String(error));
}
</script>
</body>
</html>
