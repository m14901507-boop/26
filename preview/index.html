<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOOSY</title>
<meta name="theme-color" content="#030303">
<style>html,body{margin:0;min-height:100%;background:#030303;color:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,rgba(22,135,255,.16),transparent 30%),#030303}.boot div{text-align:center}.boot b{font-size:28px}.boot span{display:block;margin-top:10px;color:#9aa4b2}</style>
</head>
<body>
<div class="boot"><div><b>FLOOSY</b><span>جاري تحميل النظام المالي...</span></div></div>
<script>
(async()=>{
  try{
    // Start from a clean client session so an expired token cannot trigger Unauthorized on boot.
    sessionStorage.removeItem('floosy_preview_session');
    localStorage.removeItem('floosy_preview_session');

    const base='base.html?v=5';
    let html=await fetch(base,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('تعذر تحميل الواجهة');return r.text()});
    html=html.replace("if(sessionStorage.getItem('floosy_preview_session'))refresh();","");
    html=html.replace('</head>','<link rel="stylesheet" href="theme-pro.css?v=5"></head>');
    html=html.replace('</body>','<script src="budget-actions.js?v=1"><\/script><script src="accounts-extra.js?v=1"><\/script><script src="embedded-pages.js?v=3"><\/script><script src="balance-date-fix.js?v=4"><\/script><script src="classification-source-fix.js?v=2"><\/script><script src="item-editor-core.js?v=1"><\/script><script src="item-state-lite.js?v=1"><\/script><script src="sync-core.js?v=11"><\/script><script src="transactions-table-fix.js?v=6"><\/script><script src="operations-schema-fix.js?v=6"><\/script><script src="fast-refresh.js?v=9"><\/script><script>try{setStatus(\'الواجهة جاهزة. أدخل كلمة المرور لتسجيل الدخول.\');document.getElementById(\'loginBox\').style.display=\'block\';}catch(e){}<\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="boot"><div><b>FLOOSY</b><span>'+String(e.message||e)+'</span></div></div>'}
})();
</script>
</body>
</html>
