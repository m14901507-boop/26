<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Floosy React Preview</title>
  <meta name="theme-color" content="#07111e" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--bg:#07111e;--card:#0d1b2a;--card2:#13263b;--border:#26384a;--text:#f8fafc;--muted:#9fb0c3;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(59,130,246,.12),transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:22px 14px;background:#091624;border-left:1px solid var(--border)}.brand{font-size:24px;font-weight:800;margin-bottom:26px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:right;background:transparent;border:1px solid transparent;color:var(--muted);padding:12px;border-radius:12px;cursor:pointer}.nav button.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);color:#fff}.main{padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0}.top p{color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;cursor:pointer}input{background:#091624;color:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 12px}.status{margin:18px 0;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(245,158,11,.1)}.status.ok{background:rgba(34,197,94,.1)}.login{max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:20px 0}.login form{display:flex;gap:8px}.login input{flex:1}.kpis,.accounts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.accounts{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}.card span,.card small{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:25px;margin:9px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.panel h2{margin-top:0}.budget{margin:12px 0}.budget .row{display:flex;justify-content:space-between;gap:10px}.track{height:8px;background:#17263a;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa)}.tx{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}.tx small{display:block;color:var(--muted);margin-top:4px}.muted{color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static}.kpis,.accounts,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:560px){.kpis,.accounts,.grid2{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}.login form{flex-direction:column}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="typescript,react">
const {useEffect,useMemo,useState}=React;
const API='https://floosy-api.m14901507.workers.dev';
const defs=[['عائلي شهري','AHLI_001','الأهلي 001'],['عائلي سنوي','AHLI_001','الأهلي 001'],['شخصي شهري','AHLI_001','الأهلي 001'],['شخصي سنوي','AHLI_001','الأهلي 001'],['تأمين المصروف','AHLI_002','الأهلي 002'],['تأمين الدخل','AHLI_002','الأهلي 002'],['الادخار والاستثمار','DHOFAR','بنك ظفار']];
const money=(v:any)=>Number.isFinite(Number(v))?`${Number(v).toLocaleString('ar-OM',{minimumFractionDigits:3,maximumFractionDigits:3})} ر.ع`:'—';
const nowMonth=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const serial=(m:string)=>{const [y,n]=m.split('-').map(Number);return Math.round((Date.UTC(y,n-1,1)-Date.UTC(1899,11,30))/86400000)};
const matchMonth=(v:any,m:string)=>typeof v==='number'?Math.abs(v-serial(m))<2:String(v||'').includes(m);
async function request(path:string,options:any={}){const token=sessionStorage.getItem('floosy_preview_session');const headers:any={Accept:'application/json',...(options.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API+path,{...options,headers,credentials:'omit'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`API ${r.status}`);return d}
function App(){
 const [month,setMonth]=useState(nowMonth());const [rows,setRows]=useState<any[]>([]);const [messages,setMessages]=useState<any[]>([]);const [unread,setUnread]=useState<any>(null);const [status,setStatus]=useState('النسخة التجريبية جاهزة.');const [ok,setOk]=useState(false);const [pass,setPass]=useState('');const [busy,setBusy]=useState(false);const [tab,setTab]=useState('dashboard');
 const refresh=async()=>{setBusy(true);setStatus('جاري تحميل البيانات...');try{const [b,u,m]=await Promise.all([request('/api/budgets'),request('/api/gmail/unread'),request('/api/gmail/recent-bank-messages')]);setRows(b.rows||[]);setUnread(u.unread);setMessages(m.messages||[]);setOk(true);setStatus('تم تحميل البيانات بنجاح.');}catch(e:any){setOk(false);setStatus(e.message||String(e));}finally{setBusy(false)}};
 useEffect(()=>{if(sessionStorage.getItem('floosy_preview_session'))refresh()},[]);
 const login=async(e:any)=>{e.preventDefault();setBusy(true);try{const d=await request('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});if(d.session)sessionStorage.setItem('floosy_preview_session',d.session);setPass('');await refresh();}catch(e:any){setStatus(e.message)}finally{setBusy(false)}};
 const monthRows=useMemo(()=>rows.filter(r=>matchMonth(r[0],month)),[rows,month]);
 const map=useMemo(()=>new Map(monthRows.map(r=>[String(r[2]||''),r])),[monthRows]);
 const budgets=defs.map(([budget,key,name])=>({budget,key,name,amount:map.get(budget)?.[4]??null}));
 const total=budgets.reduce((s,x)=>s+(Number.isFinite(Number(x.amount))?Number(x.amount):0),0);
 const configured=budgets.filter(x=>Number.isFinite(Number(x.amount))).length;
 return <div className="shell"><aside className="side"><div className="brand">فلوسي<small>React + TypeScript Preview</small></div><div className="nav">{[['dashboard','لوحة العرض'],['budgets','الموازنات'],['transactions','آخر العمليات'],['accounts','الحسابات']].map(([k,l])=><button key={k} className={tab===k?'active':''} onClick={()=>setTab(k)}>{l}</button>)}</div></aside><main className="main"><div className="top"><div><h1>{tab==='dashboard'?'لوحة العرض':tab==='budgets'?'الموازنات':tab==='transactions'?'آخر العمليات':'الحسابات'}</h1><p>نسخة React تجريبية مستقلة — لا تغيّر الموقع الرئيسي.</p></div><div className="actions"><input type="month" value={month} onChange={e=>setMonth(e.target.value)}/><button onClick={refresh} disabled={!ok||busy}>تحديث</button></div></div><div className={'status '+(ok?'ok':'')}>{status}</div>{!ok&&<div className="login"><h2>تسجيل الدخول إلى Floosy</h2><form onSubmit={login}><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="كلمة المرور" required/><button disabled={busy}>دخول</button></form></div>}
 {tab==='dashboard'&&<><section className="kpis"><div className="card"><span>إجمالي الموازنات</span><strong>{money(total)}</strong><small>للشهر المحدد</small></div><div className="card"><span>الموازنات المحددة</span><strong>{configured} / {defs.length}</strong><small>من نفس الورقة الحالية</small></div><div className="card"><span>Gmail غير المقروء</span><strong>{unread??'—'}</strong><small>من Gmail API</small></div><div className="card"><span>آخر العمليات</span><strong>{messages.length||'—'}</strong><small>معاينة بنكية</small></div></section><section className="accounts"><div className="card"><span>الأهلي 001</span><strong>—</strong><small>عائلي + شخصي</small></div><div className="card"><span>الأهلي 002</span><strong>—</strong><small>تأمين المصروف + الدخل</small></div><div className="card"><span>بنك ظفار</span><strong>—</strong><small>الادخار والاستثمار</small></div></section><section className="grid2"><div className="panel"><h2>توزيع الموازنات</h2>{budgets.map(x=>{const p=total>0?Number(x.amount||0)/total*100:0;return <div className="budget" key={x.budget}><div className="row"><span>{x.budget}</span><strong>{money(x.amount)}</strong></div><div className="track"><div className="fill" style={{width:`${Math.min(100,p)}%`}}/></div></div>})}</div><div className="panel"><h2>آخر العمليات البنكية</h2>{messages.length?messages.slice(0,8).map(x=><div className="tx" key={x.id}><div><strong>{x.subject||'عملية بنكية'}</strong><small>{x.bank} · {x.operationType}</small></div><b>{money(x.amount)}</b></div>):<p className="muted">لا توجد بيانات.</p>}</div></section></>}
 {tab==='budgets'&&<div className="panel"><h2>الموازنات الحالية</h2>{budgets.map(x=><div className="tx" key={x.budget}><div><strong>{x.budget}</strong><small>{x.name}</small></div><b>{money(x.amount)}</b></div>)}</div>}
 {tab==='transactions'&&<div className="panel"><h2>آخر العمليات</h2>{messages.map(x=><div className="tx" key={x.id}><div><strong>{x.subject||'عملية بنكية'}</strong><small>{x.bank} · {x.operationType} · {x.date||''}</small></div><b>{money(x.amount)}</b></div>)}</div>}
 {tab==='accounts'&&<section className="accounts"><div className="card"><span>الأهلي 001</span><strong>—</strong><small>عائلي شهري · عائلي سنوي · شخصي شهري · شخصي سنوي</small></div><div className="card"><span>الأهلي 002</span><strong>—</strong><small>تأمين المصروف · تأمين الدخل</small></div><div className="card"><span>بنك ظفار</span><strong>—</strong><small>الادخار والاستثمار</small></div></section>}
 </main></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
