<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLOOSY — الإيجارات</title><link rel="stylesheet" href="theme-pro.css"><style>
:root{--black:#050505;--panel:#141922;--panel2:#1a2130;--yellow:#ffc928;--red:#ff4458;--green:#21d38b;--blue:#1687ff;--white:#f8fafc;--muted:#9aa4b2;--line:#30394a}*{box-sizing:border-box}body{margin:0;color:var(--white);font-family:Tahoma,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1550px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:13px;background:var(--yellow);color:#111;display:grid;place-items:center;font-size:24px;font-weight:900}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#111722}.nav a.active{background:var(--blue);border-color:var(--blue)}.btn{color:white;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn.green{background:#0c7b51;border-color:#21d38b}.status{margin:14px 0;padding:11px 14px;border:1px solid var(--yellow);border-radius:12px;color:var(--yellow);background:#171409}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 16px 38px rgba(0,0,0,.26)}.card label{color:var(--muted);font-size:12px}.card strong{display:block;margin-top:8px;font-size:27px}.green{border-color:rgba(33,211,139,.55)}.red{border-color:rgba(255,68,88,.55)}.yellow{border-color:rgba(255,201,40,.55)}.blue{border-color:rgba(22,135,255,.55)}.grid{display:grid;grid-template-columns:420px 1fr;gap:12px;margin-top:12px}.panel h2{margin:0 0 14px}.form{display:grid;gap:10px}.control{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #3a4558;background:#0e141d;color:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tablewrap{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid #30394a;text-align:right;white-space:nowrap}th{color:var(--yellow);position:sticky;top:0;background:#111722}.in{color:var(--green)}.out{color:var(--red)}.actions{display:flex;gap:6px}.pill{padding:4px 8px;border-radius:99px;background:#101722;border:1px solid #394458}.receiptBox{display:none;margin-top:12px}.receiptBox.active{display:block}.small{font-size:11px;color:var(--muted)}@media(max-width:950px){.kpis,.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">F</div><div><h1 style="margin:0">الإيجارات</h1><small style="color:var(--muted)">سجل المستأجرين والإيصالات</small></div></div><div class="nav"><a href="./">لوحة العرض</a><a class="active" href="rentals.html">الإيجارات</a><a href="associations.html">الجمعيات</a><button id="refresh" class="btn primary">تحديث البيانات</button></div></div><div id="status" class="status">جاري التحميل…</div><div class="kpis"><div class="card blue"><label>عدد المستأجرين</label><strong id="tenantCount">0</strong></div><div class="card green"><label>إجمالي الإيجار الشهري</label><strong id="monthlyTotal">0.000 ر.ع</strong></div><div class="card yellow"><label>إيصالات مسجلة</label><strong id="receiptCount">0</strong></div><div class="card red"><label>متأخر/يحتاج متابعة</label><strong id="lateCount">0</strong></div></div><div class="grid"><div><div class="panel"><h2>إضافة / تعديل مستأجر</h2><form id="tenantForm" class="form"><input type="hidden" id="tenantId"><input id="name" class="control" placeholder="اسم المستأجر" required><input id="email" class="control" type="email" placeholder="البريد الإلكتروني"><input id="unit" class="control" placeholder="الوحدة / العقار"><div class="two"><input id="rent" class="control" type="number" step="0.001" min="0" placeholder="الإيجار الشهري"><input id="dueDay" class="control" type="number" min="1" max="31" placeholder="يوم الاستحقاق"></div><select id="tenantStatus" class="control"><option>نشط</option><option>متأخر</option><option>متوقف</option></select><textarea id="notes" class="control" placeholder="ملاحظات"></textarea><button class="btn primary">حفظ المستأجر</button></form></div><div id="receiptBox" class="panel receiptBox"><h2>تسجيل استلام</h2><div id="receiptTenant" class="small"></div><form id="receiptForm" class="form"><input type="hidden" id="receiptTenantId"><div class="two"><input id="receiptAmount" class="control" type="number" step="0.001" min="0" placeholder="المبلغ" required><input id="receiptDate" class="control" type="date" required></div><input id="receiptNote" class="control" placeholder="ملاحظة الإيصال"><label><input id="sendEmail" type="checkbox"> إرسال إيصال وشكر بالبريد</label><button class="btn green">تسجيل الاستلام</button></form></div></div><div class="panel"><h2>سجل المستأجرين</h2><div class="tablewrap"><table><thead><tr><th>المستأجر</th><th>البريد</th><th>الوحدة</th><th>الإيجار</th><th>الاستحقاق</th><th>الحالة</th><th>آخر استلام</th><th>آخر مبلغ</th><th>الإجراءات</th></tr></thead><tbody id="tenantRows"></tbody></table></div><h2 style="margin-top:22px">سجل الإيصالات</h2><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>المستأجر</th><th>المبلغ</th><th>الإرسال</th><th>ملاحظات</th></tr></thead><tbody id="receiptRows"></tbody></table></div></div></div></div><script>
const API='https://floosy-api.m14901507.workers.dev',$=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' ر.ع';let DATA={rentals:[],receipts:[]};
async function req(p,opt={}){let token=sessionStorage.getItem('floosy_preview_session'),r=await fetch(API+p,{...opt,headers:{Accept:'application/json',...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})},credentials:'omit'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'API '+r.status);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let r=DATA.rentals||[],rec=DATA.receipts||[];$('tenantCount').textContent=r.filter(x=>x.active!==false).length;$('monthlyTotal').textContent=money(r.filter(x=>x.active!==false).reduce((s,x)=>s+Number(x.monthlyRent||0),0));$('receiptCount').textContent=rec.length;$('lateCount').textContent=r.filter(x=>String(x.status).includes('متأخر')).length;$('tenantRows').innerHTML=r.map(x=>`<tr><td><b>${esc(x.name||'—')}</b></td><td>${esc(x.email||'—')}</td><td>${esc(x.unit||'—')}</td><td>${money(x.monthlyRent)}</td><td>${x.dueDay||'—'}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.lastReceiptDate||'—')}</td><td>${money(x.lastReceiptAmount)}</td><td><div class="actions"><button class="btn edit" data-id="${x.tenantId}">تعديل</button><button class="btn green receipt" data-id="${x.tenantId}">استلام</button>${x.publicToken?`<button class="btn link" data-token="${x.publicToken}">رابط</button>`:''}</div></td></tr>`).join('');let names=new Map(r.map(x=>[x.tenantId,x.name]));$('receiptRows').innerHTML=rec.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(names.get(x.tenantId)||x.tenantId)}</td><td class="in">${money(x.amount)}</td><td>${esc(x.sendStatus||'—')}</td><td>${esc(x.notes||'—')}</td></tr>`).join('')}
async function load(){try{$('status').textContent='جاري تحميل سجل الإيجارات…';let d=await req('/api/rentals');DATA=d;render();$('status').textContent=`تم تحميل ${DATA.rentals.length} مستأجر و${DATA.receipts.length} إيصال`;}catch(e){$('status').textContent=e.message}}
$('tenantForm').onsubmit=async e=>{e.preventDefault();try{let body={tenantId:$('tenantId').value,name:$('name').value,email:$('email').value,unit:$('unit').value,monthlyRent:Number($('rent').value||0),dueDay:Number($('dueDay').value||0),status:$('tenantStatus').value,notes:$('notes').value};await req('/api/rentals/upsert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();$('tenantId').value='';await load();$('status').textContent='تم حفظ المستأجر';}catch(err){$('status').textContent=err.message}};
$('tenantRows').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.classList.contains('edit')){let x=DATA.rentals.find(t=>t.tenantId===b.dataset.id);if(!x)return;$('tenantId').value=x.tenantId;$('name').value=x.name;$('email').value=x.email;$('unit').value=x.unit;$('rent').value=x.monthlyRent;$('dueDay').value=x.dueDay;$('tenantStatus').value=x.status;$('notes').value=x.notes;scrollTo({top:0,behavior:'smooth'})}if(b.classList.contains('receipt')){let x=DATA.rentals.find(t=>t.tenantId===b.dataset.id);$('receiptTenantId').value=x.tenantId;$('receiptTenant').textContent=`المستأجر: ${x.name} — ${x.unit}`;$('receiptAmount').value=x.monthlyRent||'';$('receiptDate').value=new Date().toISOString().slice(0,10);$('receiptBox').classList.add('active')}if(b.classList.contains('link')){let u=`https://m14901507-boop.github.io/26/preview/tenant.html?t=${encodeURIComponent(b.dataset.token)}`;navigator.clipboard?.writeText(u);$('status').textContent='تم نسخ رابط صفحة المستأجر'}};
$('receiptForm').onsubmit=async e=>{e.preventDefault();try{let d=await req('/api/rentals/receipt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenantId:$('receiptTenantId').value,amount:Number($('receiptAmount').value),date:$('receiptDate').value,notes:$('receiptNote').value,sendEmail:$('sendEmail').checked})});$('receiptBox').classList.remove('active');e.target.reset();await load();$('status').textContent=d.receipt.sendStatus==='تم الإرسال'?'تم تسجيل الاستلام وإرسال الإيصال':'تم تسجيل الاستلام بنجاح';}catch(err){$('status').textContent=err.message}};$('refresh').onclick=load;load();
</script></body></html>
