<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLOOSY — الجمعيات</title>
<style>
:root{--black:#050505;--panel:#0d0d0d;--yellow:#f4c430;--red:#ef4444;--green:#22c55e;--blue:#1687ff;--white:#f8fafc;--muted:#9ca3af;--line:#262626}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:Tahoma,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:13px;background:var(--yellow);color:#111;display:grid;place-items:center;font-size:24px;font-weight:900}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#111}.nav a.active{background:var(--blue);border-color:var(--blue)}.btn{color:white;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue)}.status{margin:14px 0;padding:11px 14px;border:1px solid var(--yellow);border-radius:12px;color:var(--yellow)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}.card label{color:var(--muted);font-size:12px}.card strong{display:block;margin-top:8px;font-size:27px}.green{border-color:var(--green)}.red{border-color:var(--red)}.yellow{border-color:var(--yellow)}.blue{border-color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:12px}.panel h2{margin:0 0 14px}.bars{display:grid;gap:10px}.bar{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center}.track{height:10px;border-radius:20px;background:#222;overflow:hidden}.fill{height:100%;background:var(--green)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--yellow)}.in{color:var(--green)}.out{color:var(--red)}@media(max-width:800px){.kpis,.grid{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 90px}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand"><div class="logo">F</div><div><h1 style="margin:0">الجمعيات</h1><small style="color:var(--muted)">FLOOSY — متابعة المساهمات والتحويلات</small></div></div><div class="nav"><a href="./">لوحة العرض</a><a href="rentals.html">الإيجارات</a><a class="active" href="associations.html">الجمعيات</a><button id="refresh" class="btn primary">تحديث البيانات</button></div></div><div id="status" class="status">جاري التحميل…</div><div class="kpis"><div class="card green"><label>إجمالي الداخل</label><strong id="income">0.000 ر.ع</strong></div><div class="card red"><label>إجمالي الخارج</label><strong id="expense">0.000 ر.ع</strong></div><div class="card blue"><label>عدد العمليات</label><strong id="count">0</strong></div><div class="card yellow"><label>آخر حركة</label><strong id="last">—</strong></div></div><div class="grid"><div class="panel"><h2>توزيع عمليات الجمعية</h2><div id="bars" class="bars"></div></div><div class="panel"><h2>سجل الجمعيات</h2><div style="overflow:auto"><table><thead><tr><th>التاريخ</th><th>البند</th><th>الحركة</th><th>المبلغ</th><th>الحساب / البنك</th><th>الوصف</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<script>
const API='https://floosy-api.m14901507.workers.dev', $=id=>document.getElementById(id), norm=s=>String(s||'').toLowerCase().replace(/[\s_\-]+/g,''), money=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' ر.ع';
async function req(p){let token=sessionStorage.getItem('floosy_preview_session'),r=await fetch(API+p,{headers:{Accept:'application/json',...(token?{Authorization:'Bearer '+token}:{})},credentials:'omit'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'API '+r.status);return d}
function idx(h,patterns){for(let i=0;i<h.length;i++){let x=norm(h[i]);if(patterns.some(p=>p.test(x)))return i}return-1}
async function load(){try{$('status').textContent='جاري قراءة عمليات الجمعيات…';let o=await req('/api/operations'),h=o.headers||[],m={date:idx(h,[/التاريخ/,/date/]),item:idx(h,[/البند/,/item/]),amount:idx(h,[/المبلغ/,/amount/]),movement:idx(h,[/الحركة/,/نوعالعملية/,/type/]),account:idx(h,[/الحساب/,/البنك/,/account/]),desc:idx(h,[/الوصف/,/الطرف/,/description/,/merchant/])};let data=(o.rows||[]).map(r=>({date:r[m.date],item:String(r[m.item]||''),amount:Math.abs(Number(r[m.amount])||0),movement:String(r[m.movement]||''),account:String(r[m.account]||''),desc:String(r[m.desc]||'')})).filter(x=>/جمعية|جمعيه|association|saving group|مساهمة|مساهمه/.test((x.item+' '+x.desc).toLowerCase()));let inc=data.filter(x=>/دخل|وارد|credit/.test(x.movement.toLowerCase())).reduce((s,x)=>s+x.amount,0),out=data.filter(x=>!/دخل|وارد|credit/.test(x.movement.toLowerCase())).reduce((s,x)=>s+x.amount,0);$('income').textContent=money(inc);$('expense').textContent=money(out);$('count').textContent=data.length;$('last').textContent=data.length?new Date(data.map(x=>new Date(x.date)).sort((a,b)=>b-a)[0]).toLocaleDateString('ar-OM'):'—';let stats=new Map();data.forEach(x=>{let z=stats.get(x.item)||{n:0,v:0};z.n++;z.v+=x.amount;stats.set(x.item,z)});let arr=[...stats].sort((a,b)=>b[1].v-a[1].v),max=Math.max(1,...arr.map(x=>x[1].v));$('bars').innerHTML=arr.length?arr.slice(0,8).map(([k,v])=>`<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${v.v/max*100}%"></div></div><b>${v.n} | ${money(v.v)}</b></div>`).join(''):'<p style="color:var(--muted)">لا توجد عمليات مصنفة كجمعيات حتى الآن.</p>';$('rows').innerHTML=data.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>`<tr><td>${new Date(x.date).toLocaleDateString('ar-OM')}</td><td>${x.item||'—'}</td><td>${x.movement}</td><td class="${/دخل|وارد|credit/.test(x.movement.toLowerCase())?'in':'out'}">${money(x.amount)}</td><td>${x.account}</td><td>${x.desc}</td></tr>`).join('');$('status').textContent=data.length?`تم العثور على ${data.length} عملية مرتبطة بالجمعيات`:'لا توجد عمليات جمعية مطابقة في ورقة العمليات.'}catch(e){$('status').textContent=e.message}}
$('refresh').onclick=load;load();
</script></body></html>
