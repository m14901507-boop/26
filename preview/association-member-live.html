<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FLOOSY — متابعة الجمعية</title>
<style>html,body{margin:0;min-height:100%;background:#020914;color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 72% 8%,rgba(45,156,255,.18),transparent 30%),#020914}.boot div{text-align:center}.boot b{font-size:24px}.boot span{display:block;margin-top:8px;color:#8ea9bf;font-size:12px}</style>
</head>
<body>
<div class="boot"><div><b>FLOOSY</b><span>جاري تحميل أحدث نسخة من صفحة العضو…</span></div></div>
<script>
(async()=>{
  try{
    const html=await fetch('association-member.html?v=20260912-4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('تعذر تحميل صفحة العضو');return r.text()});
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="boot"><div><b>FLOOSY</b><span>'+String(e.message||e)+'</span></div></div>'}
})();
</script>
</body>
</html>
